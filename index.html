<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="weather-app">
    <h1>Cek cuaca kota</h1>

    <form id="searchForm">
      <label for="cityInput" class="sr-only">Nama kota</label>
      <input type="text" id="cityInput" placeholder="Contoh: Medan" autocomplete="off">
      <button type="submit">Cari cuaca</button>
    </form>

    <div id="loading" class="hidden" role="status">Memuat data...</div>
    <div id="error" class="hidden" role="alert"></div>

    <section id="weatherResult" class="hidden">
      <h2 id="cityName"></h2>
      <img id="weatherIcon" alt="Ikon cuaca">
      <p id="temperature" class="temp"></p>
      <p id="description"></p>
      <p id="humidity"></p>
    </section>

    <section id="historySection" class="hidden">
      <h3>Pencarian terakhir</h3>
      <ul id="historyList"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
